name: Deploy to firebase production

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: '.node-version'
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: github-actions-frontend@houfu-cf.iam.gserviceaccount.com
      - name: install
        run: yarn install
      - name: test
        run: yarn test
      - name: build
        env:
          NEXT_PUBLIC_APP_ENV: 'PRODUCTION'
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID_PROD }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL_PROD }}
        run: yarn build
      - name: deploy
        run: npx firebase-tools deploy --only hosting --project houfu-cf
